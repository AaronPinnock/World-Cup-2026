function parseGMT(gmtKO,baseDate){
  const nd=gmtKO.includes("+1");
  const [hh,mm]=gmtKO.replace("+1","").split(":").map(Number);
  const d=new Date(baseDate+"T00:00:00Z");
  if(nd)d.setUTCDate(d.getUTCDate()+1);
  d.setUTCHours(hh,mm,0,0);
  return d;
}
function fmt(date,off){
  const a=new Date(date.getTime()+off*3600000);
  return String(a.getUTCHours()).padStart(2,"0")+":"+String(a.getUTCMinutes()).padStart(2,"0");
}

});

  if(r.includes("16"))return{b:"#064e3b",t:"#34D399"};

  if(r.includes("3rd"))return{b:"#7c2d12",t:"#fb923c"};
  return{b:"#1e293b",t:"#64748b"};
};

// ── TODAY: use real device date ─────────────────────────────────────────────
function getToday(){
  const n=new Date();
  const y=n.getFullYear(),m=String(n.getMonth()+1).padStart(2,"0"),d=String(n.getDate()).padStart(2,"0");
  return`${y}-${m}-${d}`;
}

function fmtLabel(d){
  return new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}

// ── APP ─────────────────────────────────────────────────────────────────────
function App(){
  const TODAY=getToday();
  const todayIdx=DATES.indexOf(TODAY);
  const startIdx=todayIdx>=0?todayIdx:0;
  const [idx,setIdx]=useState(startIdx);
  const [roundFilter,setRoundFilter]=useState("All");
  const stripRef=useRef(null);

  const activeDate=DATES[idx];
  const dayFix=byDate[activeDate]||[];
  const isPast=activeDate<TODAY;
  const isToday=activeDate===TODAY;

  // scroll active date tab into view
  useEffect(()=>{
    if(!stripRef.current)return;
    const btn=stripRef.current.children[idx];
    if(btn)btn.scrollIntoView({behavior:"smooth",block:"nearest",inline:"center"});
  },[idx]);

  const roundsOnDay=["All",...Array.from(new Set(dayFix.map(f=>f.round.startsWith("Group")?"Groups":f.round)))];
  const displayed=roundFilter==="All"?dayFix:dayFix.filter(f=>roundFilter==="Groups"?f.round.startsWith("Group"):f.round.includes(roundFilter));

  const go=(i)=>{setIdx(i);setRoundFilter("All");};

  // ── JSX helpers ────────────────────────────────────────────────────────────
  const TimeBox=({flag,label,time})=>React.createElement("div",{style:{background:"#050b14",borderRadius:8,padding:"7px 4px",textAlign:"center",border:"1px solid #162032",flex:1}},
    React.createElement("div",{style:{fontSize:9,color:"#475569",marginBottom:2}},flag+" "+label),
    React.createElement("div",{style:{fontSize:16,fontWeight:800,color:"#93c5fd",fontVariantNumeric:"tabular-nums",letterSpacing:"0.5px"}},time)
  );

  const Card=({f})=>{
    const rs=RS(f.round);
    const eng=f.home==="England"||f.away==="England";
    const isFinal=f.round==="FINAL";
    const isTBD=f.home==="TBD";
    const hasScore=f.score!==null;
    return React.createElement("div",{style:{
      background:isFinal?"linear-gradient(135deg,#1c1000,#1a1200)":eng?"linear-gradient(135deg,#0a1628,#0e1e3a)":"#0b1321",
      border:`1px solid ${eng?"#1d4ed8":isFinal?"#78350f":"#162032"}`,
      borderRadius:12,overflow:"hidden",
      boxShadow:eng?"0 0 12px #1d4ed820":isFinal?"0 0 16px #92400e20":"none",
      marginBottom:0,
    }},
      // England ribbon
      eng&&React.createElement("div",{style:{background:"linear-gradient(90deg,#1d4ed8,#2563eb)",padding:"4px 14px",display:"flex",alignItems:"center",gap:6}},
        React.createElement("span",{style:{fontSize:13}},"🏴󠁧󠁢󠁥󠁮󠁧󠁿"),
        React.createElement("span",{style:{fontSize:10,fontWeight:800,color:"#fff",letterSpacing:"2px",textTransform:"uppercase"}},"England")
      ),
      // Round badge
      React.createElement("div",{style:{background:rs.b,padding:"3px 14px",display:"flex",alignItems:"center",justifyContent:"space-between"}},
        React.createElement("span",{style:{fontSize:10,fontWeight:700,color:rs.t,letterSpacing:"1.5px",textTransform:"uppercase"}},f.round),
        f.nextDay&&React.createElement("span",{style:{fontSize:9,color:rs.t,opacity:0.55}},"next day (UTC)")
      ),
      React.createElement("div",{style:{padding:"13px 14px"}},
        // Teams
        hasScore
          ? React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
              React.createElement("div",{style:{flex:1,textAlign:"right",fontSize:13,fontWeight:600,color:"#e2e8f0"}},
                FLAGS[f.home]&&React.createElement("span",{style:{marginRight:5}},FLAGS[f.home]),f.home
              ),
              React.createElement("div",{style:{background:"#050b14",border:"1px solid #1e3a5f",borderRadius:8,padding:"5px 12px",textAlign:"center",minWidth:72,flexShrink:0}},
                React.createElement("div",{style:{fontSize:22,fontWeight:900,color:"#f8fafc",letterSpacing:"3px",fontVariantNumeric:"tabular-nums"}},f.score[0]+" – "+f.score[1]),
                React.createElement("div",{style:{fontSize:8,color:"#475569",letterSpacing:"1.5px",textTransform:"uppercase",marginTop:1}},"FT")
              ),
              React.createElement("div",{style:{flex:1,textAlign:"left",fontSize:13,fontWeight:600,color:"#e2e8f0"}},
                f.away,FLAGS[f.away]&&React.createElement("span",{style:{marginLeft:5}},FLAGS[f.away])
              )
            )
          : React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
              React.createElement("div",{style:{flex:1,textAlign:"right",fontSize:13,fontWeight:600,color:isTBD?"#1e3a5f":"#e2e8f0"}},
                !isTBD&&FLAGS[f.home]&&React.createElement("span",{style:{marginRight:5}},FLAGS[f.home]),f.home
              ),
              React.createElement("div",{style:{padding:"4px 10px",background:"#0f1e30",borderRadius:6,fontSize:11,color:"#334155",fontWeight:700,letterSpacing:"1px",flexShrink:0}},"vs"),
              React.createElement("div",{style:{flex:1,textAlign:"left",fontSize:13,fontWeight:600,color:isTBD?"#1e3a5f":"#e2e8f0"}},
                f.away,!isTBD&&FLAGS[f.away]&&React.createElement("span",{style:{marginLeft:5}},FLAGS[f.away])
              )
            ),
        // Venue
        React.createElement("div",{style:{textAlign:"center",marginBottom:10}},
          React.createElement("span",{style:{fontSize:12,color:"#94a3b8",fontWeight:500}},"📍 "+f.venue+", "+f.city)
        ),
        // Times
        hasScore
          ? React.createElement("div",{style:{display:"flex",justifyContent:"center",gap:18}},
              React.createElement("span",{style:{fontSize:10,color:"#334155"}},"🇬🇧 UK: "+f.ukTime),
              React.createElement("span",{style:{fontSize:10,color:"#334155"}},"🇦🇪 UAE: "+f.uaeTime)
            )
          : React.createElement("div",{style:{display:"flex",gap:6}},
              React.createElement(TimeBox,{flag:"🕐",label:"Local",time:f.localTime}),
              React.createElement(TimeBox,{flag:"🇬🇧",label:"UK (BST)",time:f.ukTime}),
              React.createElement(TimeBox,{flag:"🇦🇪",label:"UAE (GST)",time:f.uaeTime})
            )
      )
    );
  };

  // ── RENDER ─────────────────────────────────────────────────────────────────
  return React.createElement("div",{style:{minHeight:"100vh",background:"#070d1a",color:"#e2e8f0",fontFamily:"-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif"}},

    // HEADER
    React.createElement("div",{style:{background:"linear-gradient(160deg,#0a0f1e 0%,#0e1f40 60%,#070d1a 100%)",borderBottom:"1px solid #1e3a5f",padding:"16px 16px 0",position:"sticky",top:0,zIndex:100,backdropFilter:"blur(12px)"}},
      React.createElement("div",{style:{maxWidth:860,margin:"0 auto"}},
        React.createElement("div",{style:{display:"flex",alignItems:"center",gap:10,marginBottom:2}},
          React.createElement("span",{style:{fontSize:24}},"⚽"),
          React.createElement("div",null,
            React.createElement("h1",{style:{margin:0,fontSize:18,fontWeight:800,letterSpacing:"-0.5px",color:"#fff"}},"FIFA World Cup 2026"),
            React.createElement("p",{style:{margin:0,fontSize:9,color:"#475569",letterSpacing:"2px",textTransform:"uppercase"}},"USA · Canada · Mexico  ·  11 Jun – 19 Jul")
          ),
          React.createElement("div",{style:{marginLeft:"auto",background:"#0f1f3d",border:"1px solid #1e3a5f",borderRadius:8,padding:"3px 9px",textAlign:"center",flexShrink:0}},
            React.createElement("div",{style:{fontSize:8,color:"#475569",textTransform:"uppercase",letterSpacing:"1px"}},"Today"),
            React.createElement("div",{style:{fontSize:11,color:"#93c5fd",fontWeight:700}},fmtLabel(TODAY))
          )
        ),
        // Date strip
        React.createElement("div",{ref:stripRef,style:{display:"flex",overflowX:"auto",marginTop:14,scrollbarWidth:"none",WebkitOverflowScrolling:"touch"}},
          DATES.map((d,i)=>{
            const active=i===idx;
            const past=d<TODAY;
            const tod=d===TODAY;
            return React.createElement("button",{key:d,onClick:()=>go(i),style:{
              background:"none",border:"none",
              borderBottom:active?"3px solid #3b82f6":"3px solid transparent",
              padding:"6px 10px",cursor:"pointer",
              color:active?"#fff":past?"#1e3a5f":"#4b6a8a",
              fontWeight:active?700:400,fontSize:10,
              whiteSpace:"nowrap",letterSpacing:"0.5px",flexShrink:0,
              position:"relative",transition:"all 0.12s",
            }},
              tod&&React.createElement("span",{style:{position:"absolute",top:3,right:4,width:4,height:4,borderRadius:"50%",background:"#22c55e",display:"block"}}),
              fmtLabel(d)
            );
          })
        )
      )
    ),

    // CONTENT
    React.createElement("div",{style:{maxWidth:860,margin:"0 auto",padding:"16px 12px 80px"}},

      // Day header
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:12}},
        React.createElement("h2",{style:{margin:0,fontSize:16,fontWeight:700,color:"#fff"}},
          isToday?"Today's Fixtures":fmtLabel(activeDate)
        ),
        isToday&&React.createElement("span",{style:{background:"#14532d",color:"#4ade80",fontSize:9,padding:"2px 7px",borderRadius:20,fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase"}},"Live Day"),
        isPast&&React.createElement("span",{style:{background:"#1e293b",color:"#64748b",fontSize:9,padding:"2px 7px",borderRadius:20,fontWeight:600,letterSpacing:"1px",textTransform:"uppercase"}},"Results"),
        React.createElement("span",{style:{marginLeft:"auto",fontSize:10,color:"#334155"}},dayFix.length+" fixture"+(dayFix.length!==1?"s":""))
      ),

      // Round tabs
      roundsOnDay.length>2&&React.createElement("div",{style:{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}},
        roundsOnDay.map(r=>React.createElement("button",{key:r,onClick:()=>setRoundFilter(r),style:{
          background:roundFilter===r?"#1e3a5f":"transparent",
          border:`1px solid ${roundFilter===r?"#3b82f6":"#1e293b"}`,
          borderRadius:6,padding:"3px 11px",fontSize:10,
          color:roundFilter===r?"#93c5fd":"#475569",
          cursor:"pointer",fontWeight:roundFilter===r?600:400,
        }},r))
      ),

      // Cards
      React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:10}},
        displayed.map((f,i)=>React.createElement(Card,{key:i,f}))
      ),

      displayed.length===0&&React.createElement("div",{style:{textAlign:"center",padding:"50px 20px",color:"#1e3a5f"}},
        React.createElement("div",{style:{fontSize:36,marginBottom:8}},"⚽"),
        React.createElement("p",{style:{margin:0,fontSize:12}},"No fixtures match this filter")
      ),

      // Nav
      React.createElement("div",{style:{display:"flex",justifyContent:"space-between",marginTop:20,gap:8}},
        React.createElement("button",{onClick:()=>{if(idx>0)go(idx-1);},disabled:idx===0,style:{background:"#0b1321",border:`1px solid ${idx===0?"#162032":"#1e3a5f"}`,borderRadius:8,padding:"9px 16px",color:idx===0?"#1e3a5f":"#64748b",cursor:idx===0?"default":"pointer",fontSize:12,fontWeight:600}},"← Prev"),
        React.createElement("button",{onClick:()=>go(startIdx),style:{background:"#0f1e30",border:"1px solid #3b82f6",borderRadius:8,padding:"9px 16px",color:"#60a5fa",cursor:"pointer",fontSize:12,fontWeight:600}},"Today"),
        React.createElement("button",{onClick:()=>{if(idx<DATES.length-1)go(idx+1);},disabled:idx===DATES.length-1,style:{background:"#0b1321",border:`1px solid ${idx===DATES.length-1?"#162032":"#1e3a5f"}`,borderRadius:8,padding:"9px 16px",color:idx===DATES.length-1?"#1e3a5f":"#64748b",cursor:idx===DATES.length-1?"default":"pointer",fontSize:12,fontWeight:600}},"Next →")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));

})();
</script>
